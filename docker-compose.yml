version: '3.8'

services:
  ses:
    build: .
    container_name: secure-email-service
    restart: always
    
    # Security settings
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    ports:
      - '8000:8000'
    
    volumes:
      - ses-data:/opt/web/data
      - ses-uploads:/opt/web/uploads
      - ./license_public.pem:/opt/web/license_public.pem:ro
      - ./dkim_private.pem:/opt/web/dkim_private.pem:ro
    
    environment:
      - SECRET_KEY=${SECRET_KEY}:-change_me_in_production
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}:-sk_test_mock
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}:-whsec_mock
      - SES_DOMAIN=${SES_DOMAIN}:-ses
      - SES_DOMAINS=${SES_DOMAINS}:-["ses"]
      - SMTP_HOST=${SMTP_HOST}:-
      - SMTP_PORT=${SMTP_PORT}:-25
      - DKIM_SELECTOR=${DKIM_SELECTOR}:-ses
      - TZ=UTC
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network isolation
    networks:
      - ses-network
    
    init: true

volumes:
  ses-data:
    driver: local
  ses-uploads:
    driver: local

networks:
  ses-network:
    driver: bridge
