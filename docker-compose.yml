version: '3.8'

services:
  ses:
    build: .
    container_name: securemail-enterprise
    restart: always

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

    ports:
      - '8000:8000'
      - '2525:2525'

    volumes:
      - ses-data:/opt/web/data
      - ses-uploads:/opt/web/uploads
      - ses-drive:/opt/web/drive
      - ./license_public.pem:/opt/web/license_public.pem:ro
      - ./enterprise_license.lic:/opt/web/enterprise_license.lic:ro
      - ./dkim_private.pem:/opt/web/dkim_private.pem

    environment:
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      LICENSE_REQUIRED: ${LICENSE_REQUIRED:-true}
      SES_DOMAIN: ${SES_DOMAIN:-ses}
      SES_DOMAINS: ${SES_DOMAINS:-["ses"]}
      SES_MAIL_HOST: ${SES_MAIL_HOST:-}
      SMTP_INBOUND_ENABLED: ${SMTP_INBOUND_ENABLED:-true}
      SMTP_INBOUND_PORT: ${SMTP_INBOUND_PORT:-2525}
      SMTP_RELAY_HOST: ${SMTP_RELAY_HOST:-}
      SMTP_RELAY_PORT: ${SMTP_RELAY_PORT:-587}
      SMTP_RELAY_USER: ${SMTP_RELAY_USER:-}
      SMTP_RELAY_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
      SMTP_RELAY_TLS: ${SMTP_RELAY_TLS:-true}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-ses}
      EXTERNAL_VIEWER_BASE_URL: ${EXTERNAL_VIEWER_BASE_URL:-}
      EXTERNAL_TOKEN_EXPIRY: ${EXTERNAL_TOKEN_EXPIRY:-7}
      TZ: UTC

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    networks:
      - ses-network

    init: true

volumes:
  ses-data:
  ses-uploads:
  ses-drive:

networks:
  ses-network:
    driver: bridge
